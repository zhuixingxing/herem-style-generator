<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hérem Style Generator</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hérem Style">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="msapplication-TileColor" content="#1e3a5f">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #f5ede0;
    --parchment-dark: #e8d8c0;
    --ink: #2b1d0e;
    --ochre: #c17f24;
    --ochre-dark: #8b5a0a;
    --terracotta: #b85c38;
    --blue-deep: #1e3a5f;
    --blue-mid: #2d5f8a;
    --sage: #6b7c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lora', Georgia, serif; background-color: var(--parchment); color: var(--ink); min-height: 100vh; text-align: center; padding-bottom: env(safe-area-inset-bottom); }

  header { background: var(--blue-deep); padding-top: env(safe-area-inset-top); }
  .header-inner { padding: clamp(14px,3.5vw,36px) clamp(16px,5vw,40px) clamp(10px,3vw,28px); }
  .header-ornament { display: block; font-size: clamp(0.48rem,2vw,0.7rem); letter-spacing: clamp(0.5px,1.2vw,6px); color: var(--ochre); opacity: 0.8; margin-bottom: 10px; font-family: 'Playfair Display', serif; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1rem,4.8vw,2.2rem); font-weight: 700; color: var(--parchment); letter-spacing: clamp(0px,0.8vw,4px); line-height: 1.2; }
  header h1 em { font-style: italic; color: var(--ochre); }
  .header-sub { font-family: 'Lora', serif; font-style: italic; font-size: clamp(0.7rem,2vw,0.9rem); color: #a8b8c8; margin-top: 8px; letter-spacing: 0; }
  .header-rule { width: 80px; height: 2px; background: linear-gradient(90deg, transparent, var(--ochre), transparent); margin: 14px auto 0; }
  .h1-wrap { display: inline-flex; align-items: center; gap: 10px; }
  .edit-name-btn { background: none; border: none; cursor: pointer; color: var(--ochre); opacity: 0.5; padding: 2px; line-height: 0; transition: opacity 0.2s; }
  .edit-name-btn:hover { opacity: 1; }
  .edit-name-btn svg { width: clamp(12px,2vw,16px); height: clamp(12px,2vw,16px); }
  .edit-name-modal { display: none; position: fixed; inset: 0; background: rgba(10,20,40,0.7); z-index: 100; align-items: center; justify-content: center; }
  .edit-name-modal.open { display: flex; }
  .edit-name-box { background: var(--parchment); border-radius: 6px; padding: 28px 32px; width: min(90vw, 420px); box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
  .edit-name-box label { font-family: 'Playfair Display', serif; font-size: 0.75rem; letter-spacing: 3px; color: var(--ochre-dark); text-transform: uppercase; display: block; margin-bottom: 10px; }
  .edit-name-box input { width: 100%; border: 1.5px solid #d4b896; border-radius: 4px; padding: 10px 14px; font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--ink); background: #fff; outline: none; }
  .edit-name-box input:focus { border-color: var(--ochre); }
  .edit-name-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  .edit-name-actions button { font-family: 'Playfair Display', serif; font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase; border: none; border-radius: 4px; padding: 9px 20px; cursor: pointer; }
  .btn-save-name { background: var(--blue-deep); color: var(--parchment); }
  .btn-save-name:hover { background: var(--ochre-dark); }
  .btn-cancel-name { background: transparent; color: #9a8060; border: 1px solid #d4b896 !important; }
  .btn-reset-name { background: transparent; color: var(--terracotta); font-size: 0.72rem !important; margin-right: auto; }
  .header-wash { height: 6px; background: linear-gradient(90deg, var(--terracotta) 0%, var(--ochre) 30%, var(--blue-mid) 60%, var(--sage) 100%); opacity: 0.85; }

  main { max-width: 900px; margin: 44px auto; padding: 0 22px 60px; }

  .section-label { font-family: 'Playfair Display', serif; font-size: 0.7rem; letter-spacing: 5px; color: var(--ochre-dark); text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .section-label::before, .section-label::after { content: ''; flex: 1; max-width: 60px; height: 1px; background: var(--ochre); opacity: 0.5; }

  .upload-zone { border: 1.5px dashed #b8956a; border-radius: 4px; cursor: pointer; transition: all 0.25s; background: rgba(255,255,255,0.5); position: relative; overflow: hidden; min-height: 200px; display: flex; align-items: center; justify-content: center; }
  .upload-zone::before, .upload-zone::after, .uz-corner-br, .uz-corner-tl { content: ''; position: absolute; width: 18px; height: 18px; border-color: var(--ochre); border-style: solid; opacity: 0.6; z-index: 2; }
  .upload-zone::before { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
  .upload-zone::after  { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
  .uz-corner-br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }
  .uz-corner-tl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
  .upload-zone:hover, .upload-zone.dragover { border-color: var(--ochre); background: rgba(193,127,36,0.06); }
  .upload-zone.has-image { border-style: solid; border-color: var(--ochre); min-height: 280px; }
  .upload-zone.has-image:hover .upload-overlay { opacity: 1; }
  .upload-placeholder { padding: 54px 24px; }
  .upload-icon { width: 52px; height: 52px; margin: 0 auto 14px; color: #b8956a; }
  .upload-placeholder p { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--ochre-dark); margin-bottom: 6px; }
  .upload-placeholder small { font-family: 'Lora', serif; font-style: italic; color: #9a8060; font-size: 0.8rem; display: block; margin-top: 4px; }
  .upload-preview { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  .upload-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .upload-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(30,58,95,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; z-index: 3; }
  .upload-overlay span { font-family: 'Playfair Display', serif; font-style: italic; color: var(--parchment); font-size: 0.9rem; letter-spacing: 1px; margin-top: 8px; }
  .upload-overlay svg { width: 32px; height: 32px; color: var(--ochre); }
  #fileInput { display: none; }

  /* ── Service selector ── */
  .service-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .svc-tab { font-family: 'Playfair Display', serif; font-size: 0.68rem; letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 16px; border: 1.5px solid #d4b896; border-radius: 4px; background: rgba(255,255,255,0.5); color: #7a6048; cursor: pointer; transition: all 0.2s; }
  .svc-tab.active { background: var(--blue-deep); color: var(--parchment); border-color: var(--blue-deep); }
  .svc-tab:hover:not(.active) { border-color: var(--ochre); color: var(--ochre-dark); }

  /* ── Service note ── */
  .svc-note { font-family: 'Lora', serif; font-style: italic; font-size: 0.78rem; color: #7a6048; text-align: center; margin-bottom: 14px; padding: 10px 16px; background: rgba(255,255,255,0.4); border: 1px dashed #d4b896; border-radius: 4px; line-height: 1.6; display: none; }

  .style-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-bottom: 28px; }
  .style-card { border: 1.5px solid #d4b896; border-radius: 5px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s; background: rgba(255,255,255,0.5); text-align: center; position: relative; }
  .style-card:hover { border-color: var(--ochre); transform: translateY(-2px); box-shadow: 0 3px 10px rgba(43,29,14,0.1); }
  .style-card.active { border-color: var(--ochre); border-width: 2px; box-shadow: 0 0 0 2px rgba(193,127,36,0.2); }
  .style-card.active .style-check { display: block; }
  .style-check { display: none; position: absolute; top: 4px; right: 5px; font-size: 0.65rem; color: var(--ochre-dark); font-weight: bold; z-index: 1; background: rgba(245,237,224,0.85); border-radius: 50%; width: 14px; height: 14px; line-height: 14px; text-align: center; }
  .style-swatch { height: 4px; }
  .style-info { padding: 7px 4px 8px; }
  .style-name { font-family: 'Playfair Display', serif; font-size: 0.62rem; letter-spacing: 0.5px; color: var(--ink); display: block; font-weight: 700; line-height: 1.3; }
  .style-sub { font-family: 'Lora', serif; font-style: italic; font-size: 0.55rem; color: #9a8060; display: block; margin-top: 2px; line-height: 1.3; }

  .controls { margin: 0 0 28px; background: rgba(255,255,255,0.45); border: 1px solid #d4b896; border-radius: 4px; padding: 20px 28px; text-align: center; }
  .controls label { font-family: 'Playfair Display', serif; font-size: 0.85rem; letter-spacing: 2px; color: var(--blue-deep); margin-bottom: 12px; display: block; text-transform: uppercase; }
  .controls label span { font-family: 'Lora', serif; font-style: italic; font-size: 0.78rem; letter-spacing: 0; color: #9a8060; text-transform: none; display: block; margin-top: 3px; }
  .slider-row { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  input[type=range] { flex: 1; -webkit-appearance: none; height: 3px; background: linear-gradient(90deg, var(--ochre) 0%, var(--parchment-dark) 100%); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--ochre); border: 2px solid var(--parchment); box-shadow: 0 1px 4px rgba(0,0,0,0.25); cursor: pointer; }
  .slider-val { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--ochre-dark); width: 44px; text-align: center; }

  .btn-row { display: flex; gap: 10px; align-items: stretch; }
  .btn { flex: 1; display: block; padding: 17px; background: var(--blue-deep); color: var(--parchment); border: none; border-radius: 4px; font-family: 'Playfair Display', serif; font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: background 0.25s, transform 0.1s; }
  .btn::before { content: '— '; opacity: 0.5; font-style: italic; }
  .btn::after  { content: ' —'; opacity: 0.5; font-style: italic; }
  .btn:hover:not(:disabled) { background: var(--ochre-dark); }
  .btn:active:not(:disabled) { transform: scale(0.99); }
  .btn:disabled { background: #b8a898; cursor: not-allowed; color: rgba(245,237,224,0.6); }

  .cancel-btn {
    display: none;
    padding: 17px 22px;
    background: rgba(184,92,56,0.08);
    color: var(--terracotta);
    border: 1.5px solid var(--terracotta);
    border-radius: 4px;
    font-family: 'Playfair Display', serif;
    font-size: 0.82rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cancel-btn::before { content: '✕  '; font-style: normal; opacity: 0.8; }
  .cancel-btn:hover { background: rgba(184,92,56,0.18); color: #8b2a0a; }
  .cancel-btn.visible { display: block; }

  .status { margin-top: 22px; padding: 16px 20px; border-radius: 4px; font-style: italic; font-size: 0.9rem; display: none; border-left: 3px solid transparent; }
  .status.info    { background: rgba(30,58,95,0.07); border-color: var(--blue-mid); color: var(--blue-deep); display: block; }
  .status.error   { background: rgba(184,92,56,0.08); border-color: var(--terracotta); color: #7a2c10; display: block; }
  .status.success { background: rgba(107,124,92,0.1); border-color: var(--sage); color: #3a4e2c; display: block; }
  .status.cancelled { background: rgba(184,92,56,0.06); border-color: #c09080; color: #8b5040; display: block; }
  .progress-bar { width: 100%; height: 3px; background: #d4c4a8; border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--ochre), var(--terracotta)); border-radius: 2px; transition: width 0.7s ease; }

  .results { display: none; margin-top: 36px; gap: 20px; }
  .results.show { display: grid; grid-template-columns: 1fr 1fr; }
  .result-panel { background: rgba(255,255,255,0.5); border: 1px solid #d4b896; border-radius: 4px; overflow: hidden; position: relative; }
  .result-panel::before, .result-panel::after, .rp-br, .rp-bl { content: ''; position: absolute; width: 12px; height: 12px; border-color: var(--ochre); border-style: solid; opacity: 0.5; z-index: 1; }
  .result-panel::before { top: 5px; left: 5px; border-width: 1.5px 0 0 1.5px; }
  .result-panel::after  { top: 5px; right: 5px; border-width: 1.5px 1.5px 0 0; }
  .rp-br { bottom: 5px; right: 5px; border-width: 0 1.5px 1.5px 0; }
  .rp-bl { bottom: 5px; left: 5px; border-width: 0 0 1.5px 1.5px; }
  .result-panel h3 { padding: 11px 16px; font-family: 'Playfair Display', serif; font-size: 0.7rem; letter-spacing: 3px; color: var(--ochre-dark); border-bottom: 1px solid #e8d4b4; text-align: center; text-transform: uppercase; background: rgba(245,237,224,0.6); }
  .result-panel img { width: 100%; display: block; }

  .result-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #e0cca8; }
  .action-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 8px; background: rgba(245,237,224,0.8); color: var(--blue-deep); border: none; cursor: pointer; font-family: 'Playfair Display', serif; font-size: 0.72rem; letter-spacing: 1.5px; text-transform: uppercase; transition: background 0.18s, color 0.18s; }
  .action-btn + .action-btn { border-left: 1px solid #e0cca8; }
  .action-btn:hover { background: var(--parchment-dark); color: var(--ochre-dark); }
  .action-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .action-btn.feedback { background: rgba(107,124,92,0.15); color: var(--sage); pointer-events: none; }
  .action-btn.feedback-err { background: rgba(184,92,56,0.1); color: var(--terracotta); pointer-events: none; }

  .history-section { margin-top: 56px; }
  .history-photo-card { background: rgba(255,255,255,0.45); border: 1px solid #d4b896; border-radius: 4px; overflow: hidden; margin-bottom: 16px; text-align: left; }
  .history-photo-card-header { padding: 9px 14px; background: rgba(245,237,224,0.6); border-bottom: 1px solid #e8d4b4; display: flex; align-items: center; justify-content: space-between; }
  .history-photo-card-header span { font-family: 'Playfair Display', serif; font-size: 0.68rem; letter-spacing: 2px; color: var(--ochre-dark); text-transform: uppercase; }
  .history-photo-card-header small { font-family: 'Lora', serif; font-style: italic; font-size: 0.72rem; color: #9a8060; }
  .history-photo-body { display: flex; align-items: stretch; }
  .history-orig { width: 120px; min-width: 120px; position: relative; cursor: pointer; border-right: 1px solid #e8d4b4; overflow: hidden; }
  .history-orig img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .history-orig-badge { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(30,58,95,0.7); color: var(--parchment); font-family: 'Playfair Display', serif; font-size: 0.55rem; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; padding: 4px 2px; }
  .history-results { flex: 1; display: flex; }
  .history-result-thumb { flex: 1; position: relative; cursor: pointer; border-right: 1px solid #e8d4b4; overflow: hidden; transition: opacity 0.15s; }
  .history-result-thumb:last-child { border-right: none; }
  .history-result-thumb:hover { opacity: 0.85; }
  .history-result-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; min-height: 100px; }
  .history-result-thumb-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(30,29,14,0.68); color: var(--parchment); font-family: 'Lora', serif; font-style: italic; font-size: 0.56rem; text-align: center; padding: 4px 3px; line-height: 1.4; }
  .history-empty { font-style: italic; color: #9a8060; font-size: 0.85rem; padding: 28px 0; text-align: center; }

  footer { margin-top: 60px; padding: 20px; text-align: center; font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.75rem; color: #9a8060; letter-spacing: 1px; border-top: 1px solid #d4b896; }

  @media (max-width: 700px) { .style-grid { grid-template-columns: repeat(4, 1fr); } .history-orig { width: 80px; min-width: 80px; } }
  @media (max-width: 480px) { .result-actions { grid-template-columns: 1fr 1fr; } .action-btn { padding: 9px 4px; font-size: 0.65rem; letter-spacing: 0.5px; gap: 3px; } }
  @media (max-width: 420px) { .style-grid { grid-template-columns: repeat(2, 1fr); } .btn-row { flex-direction: column; } .cancel-btn { text-align: center; } }

  .portrait-badge { display: none; align-items: center; gap: 6px; margin-top: 10px; padding: 6px 14px; background: rgba(30,58,95,0.08); border: 1px solid rgba(30,58,95,0.2); border-radius: 20px; font-family: 'Playfair Display', serif; font-size: 0.72rem; color: var(--blue-deep); letter-spacing: 1px; }
  .portrait-badge.show { display: inline-flex; }
  .portrait-badge svg { width: 13px; height: 13px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- Edit name modal -->
<div class="edit-name-modal" id="editNameModal" onclick="if(event.target===this)closeEditName()">
  <div class="edit-name-box">
    <label>自定义网站名称</label>
    <input type="text" id="editNameInput" maxlength="40" placeholder="Illustration Style Generator" onkeydown="if(event.key==='Enter')saveSiteName();if(event.key==='Escape')closeEditName()">
    <div class="edit-name-actions">
      <button class="btn-reset-name" onclick="resetSiteName()">恢复默认</button>
      <button class="btn-cancel-name" onclick="closeEditName()">取消</button>
      <button class="btn-save-name" onclick="saveSiteName()">保存</button>
    </div>
  </div>
</div>

<header>
  <div class="header-inner">
    <span class="header-ornament">✦ ATELIER D'ILLUSTRATION ✦</span>
    <h1 class="h1-wrap">
      <span id="siteTitle">Illustration <em>Style</em> Generator</span>
      <button class="edit-name-btn" onclick="openEditName()" title="自定义名称">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 13l6.586-6.586a2 2 0 012.828 2.828L11.828 15.828a2 2 0 01-1.414.586H7v-3a2 2 0 01.586-1.414z"/></svg>
      </button>
    </h1>
    <p class="header-sub">将您的照片转化为各种主流插画风格</p>
    <div class="header-rule"></div>
  </div>
  <div class="header-wash"></div>
</header>

<main>
  <div class="section-label">上传照片</div>
  <div class="upload-zone" id="dropZone">
    <div class="uz-corner-br"></div><div class="uz-corner-tl"></div>
    <div class="upload-placeholder" id="uploadPlaceholder">
      <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <p>拖拽图片至此，或点击选择</p>
      <small>支持 JPG · PNG · WEBP（最大 20MB）</small>
      <small>建筑、街景、城市风景效果最佳</small>
    </div>
    <div class="upload-preview" id="uploadPreview">
      <img id="previewImg" src="" alt="预览">
      <div class="upload-overlay">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span>点击更换图片</span>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>
  <div style="text-align:center">
    <span class="portrait-badge" id="portraitBadge">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      检测到人像，已启用人像优化参数
    </span>
  </div>

  <!-- Service selector -->
  <div class="section-label" style="margin-top:32px">选择生成服务</div>
  <div class="service-tabs" id="serviceTabs">

// ── Portrait detection ──
function isSkinPixel(r, g, b) {
  return (
    r > 95 && g > 40 && b > 20 &&
    Math.max(r, g, b) - Math.min(r, g, b) > 15 &&
    Math.abs(r - g) > 15 &&
    r > g && r > b &&
    b > g * 0.50
  );
}

async function detectPortrait(dataUrl) {
  if ('FaceDetector' in window) {
    try {
      const fd = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
      const img = new Image();
      img.src = dataUrl;
      await new Promise(r => { img.onload = r; });
      const faces = await fd.detect(img);
      if (faces.length > 0) return true;
    } catch (_) {}
  }
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 180 / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const data = c.getContext('2d').getImageData(0, 0, w, h).data;
      const fxMin = w * 0.20, fxMax = w * 0.80, fyMax = h * 0.85;
      let skinTotal = 0, skinInZone = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          if (isSkinPixel(data[i], data[i + 1], data[i + 2])) {
            skinTotal++;
            if (x >= fxMin && x < fxMax && y < fyMax) skinInZone++;
          }
        }
      }
      const skinRatio = skinTotal / (w * h);
      const zoneConc  = skinTotal > 0 ? skinInZone / skinTotal : 0;
      resolve(skinRatio > 0.15 && zoneConc > 0.55);
    };
    img.src = dataUrl;
  });
}

// ── Image helpers ──
function resizeForApi(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const max = 576;
      if (w > max || h > max) { const r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      w = Math.round(w/64)*64 || 64; h = Math.round(h/64)*64 || 64;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve({ base64: c.toDataURL('image/jpeg', 0.9).split(',')[1], width: w, height: h });
    };
    img.src = dataUrl;
  });
}

function makeThumbnail(dataUrl, maxPx) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const ratio = Math.min(maxPx / img.width, maxPx / img.height, 1);
      const w = Math.round(img.width * ratio);
      const h = Math.round(img.height * ratio);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      try {
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.7));
      } catch (_) {
        resolve(dataUrl.startsWith('data:') ? dataUrl : '');
      }
    };
    img.onerror = () => resolve(dataUrl.startsWith('data:') ? dataUrl : '');
    img.src = dataUrl;
  });
}

  const style = PORTRAIT_STYLES.find(s => s.id === activeStyleId) || PORTRAIT_STYLES[0];
  try {
    // Resize to 512px max
    const resized = await new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const max = 512;
        let w = img.width, h = img.height;
        if (w > max || h > max) { const r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = originalDataUrl;
    });
    if (isCancelled) return;

    setStatus('正在提交到 AnimeGANv2...<div class="progress-bar"><div class="progress-fill" id="pf" style="width:20%"></div></div>', 'info');

    // Queue the job (Gradio 5.x named endpoint)
    const queueRes = await fetch(`${ANIMEGAN_SPACE}/gradio_api/call/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: [{ url: resized, meta: { '_type': 'gradio.FileData' } }, style.ver] }),
    });
    if (!queueRes.ok) throw new Error('提交失败 HTTP ' + queueRes.status);
    const { event_id } = await queueRes.json();
    if (!event_id) throw new Error('未获得任务 ID');
    if (isCancelled) return;

    setStatus('AnimeGAN 处理中...<div class="progress-bar"><div class="progress-fill" id="pf" style="width:60%"></div></div>', 'info');

    // Read SSE stream for result
    const pollRes = await fetch(`${ANIMEGAN_SPACE}/gradio_api/call/generate/${event_id}`);
    if (!pollRes.ok) throw new Error('获取结果失败 HTTP ' + pollRes.status);

    const reader = pollRes.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', evtType = null, resultUrl = null;

    outer: while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event: ')) { evtType = line.slice(7).trim(); continue; }
        if (line.startsWith('data: ')) {
          const payload = line.slice(6).trim();
          if (evtType === 'complete') { resultUrl = JSON.parse(payload)[0]?.url; break outer; }
          if (evtType === 'error') throw new Error('AnimeGAN 处理失败，请重试');
        }
      }
    }

    if (!resultUrl) throw new Error('未获得图片结果');
    if (isCancelled) return;

    // Convert HF temp URL to persistent data URL so history saves correctly
    let finalUrl = resultUrl;
    try {
      const r = await fetch(resultUrl);
      if (r.ok) {
        const blob = await r.blob();
        finalUrl = await new Promise(res => {
          const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob);
        });
      }
    } catch (_) {}

    if (isCancelled) return;
    currentResultB64 = finalUrl;
    document.getElementById('resultImg').src = finalUrl;
    document.getElementById('resultLabel').textContent = style.name + ' · AnimeGAN';
    document.getElementById('results').classList.add('show');
    setStatus('生成完成！', 'success');
    await saveHistory(originalDataUrl, currentPhotoKey, finalUrl, style.name, 0);
    resetGeneratingState();
  } catch (e) {
    if (!isCancelled) { setStatus('错误: ' + e.message, 'error'); resetGeneratingState(); }
  }
}

// ── Stable Horde ──
async function generateWithHorde() {
  const strengthPct = parseInt(document.getElementById('strength').value);
  const style = STYLES.find(s => s.id === activeStyleId);

  const p = isPortrait && style.portrait
    ? { ...style.params, ...style.portrait.params }
    : { ...style.params };

  const finalPrompt = style.prompt + (isPortrait && style.portrait ? style.portrait.prompt_add : '');
  const finalNeg    = style.neg    + (isPortrait && style.portrait ? style.portrait.neg_add    : '');

  let denoising = strengthPct / 100;
  if (isPortrait && p.denoise_cap) denoising = Math.min(denoising, p.denoise_cap);
  delete p.denoise_cap;

  try {
    const { base64, width, height } = await resizeForApi(originalDataUrl);
    if (isCancelled) return;

    setStatus('正在提交任务...', 'info');

    const submitRes = await fetch(`${HORDE_BASE}/generate/async`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': HORDE_KEY, 'Client-Agent': 'illus-gen:2.0:web' },
      body: JSON.stringify({
        prompt: finalPrompt + ' ### ' + finalNeg,
        params: { ...p, denoising_strength: denoising, seed: String(Math.floor(Math.random() * 999999)), height, width, n: 1 },
        source_image: base64, source_processing: 'img2img',
        models: ['stable_diffusion'],
        r2: false, nsfw: false, censor_nsfw: true, trusted_workers: false, slow_workers: true,
      }),
    });

    if (isCancelled) return;
    if (!submitRes.ok) throw new Error('提交失败: ' + await submitRes.text());
    const { id: jobId } = await submitRes.json();
    if (!jobId) throw new Error('未获得任务 ID');

    currentJobId = jobId;
    setStatus('任务已提交，正在排队...<div class="progress-bar"><div class="progress-fill" id="pf" style="width:5%"></div></div>', 'info');
    pollStatus(jobId, style.name, strengthPct);
  } catch (e) {
    if (!isCancelled) {
      setStatus('错误: ' + e.message, 'error');
      resetGeneratingState();
    }
  }
}

async function pollStatus(jobId, styleName, strengthPct) {
  if (pollTimer) clearTimeout(pollTimer);
  if (isCancelled) return;

  try {
    const res  = await fetch(`${HORDE_BASE}/generate/check/${jobId}`, { headers: { 'Client-Agent': 'illus-gen:2.0:web' } });
    if (isCancelled) return;
    if (!res.ok) throw new Error('状态查询失败 ' + res.status);
    const data = await res.json();
    const queued   = data.queue_position || 0;
    const wait     = data.wait_time || 0;
    const progress = data.done ? 100 : Math.max(5, Math.min(90, 100 - queued * 2));
    const pf = document.getElementById('pf');
    if (pf) pf.style.width = progress + '%';

    if (data.done) {
      const r  = await fetch(`${HORDE_BASE}/generate/status/${jobId}`, { headers: { 'Client-Agent': 'illus-gen:2.0:web' } });
      const rd = await r.json();
      if (isCancelled) return;

      const gen = rd.generations && rd.generations[0];
      if (!gen || !gen.img) throw new Error('未获得图片结果');

      const finalDataUrl = gen.img.startsWith('http') ? gen.img : 'data:image/jpeg;base64,' + gen.img;
      if (isCancelled) return;

      currentJobId = null;
      currentResultB64 = finalDataUrl;
      document.getElementById('resultImg').src = finalDataUrl;
      document.getElementById('resultLabel').textContent = styleName + ' Style';
      document.getElementById('results').classList.add('show');
      setStatus('生成完成！', 'success');
      await saveHistory(originalDataUrl, currentPhotoKey, finalDataUrl, styleName, strengthPct);
      resetGeneratingState();
    } else {
      if (isCancelled) return;
      const waitMsg = wait > 0 ? `预计等待 ${wait} 秒` : '排队中';
      setStatus(`${waitMsg}，队列位置：${queued}<div class="progress-bar"><div class="progress-fill" id="pf" style="width:${progress}%"></div></div>`, 'info');
      pollTimer = setTimeout(() => pollStatus(jobId, styleName, strengthPct), 5000);
    }
  } catch (e) {
    if (isCancelled) return;
    setStatus('查询中: ' + e.message + '，5秒后重试...<div class="progress-bar"><div class="progress-fill" id="pf" style="width:30%"></div></div>', 'info');
    pollTimer = setTimeout(() => pollStatus(jobId, styleName, strengthPct), 5000);
  }
}


// ── Puter.js ──
function loadPuterScript() {
  return new Promise((resolve, reject) => {
    if (window.puter) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://js.puter.com/v2/';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('无法加载 Puter.js SDK，请检查网络连接'));
    document.head.appendChild(s);
  });
}

async function generateWithPuter() {
  try {
    setStatus('正在加载 Puter.js SDK...', 'info');
    await loadPuterScript();
    if (isCancelled) return;

    const style = STYLES.find(s => s.id === activeStyleId) || STYLES[0];

    // Step 1: Vision — describe the image
    setStatus('AI 正在分析图片内容...', 'info');
    let description = '';
    try {
      const visionResp = await puter.ai.chat(
        [{ role: 'user', content: [
          { type: 'image_url', image_url: { url: originalDataUrl } },
          { type: 'text', text: 'In 2 concise sentences, describe the main subject, scene, and key visual elements of this image. Focus on what should appear in an illustration.' },
        ]}]
      );
      description = typeof visionResp === 'string'
        ? visionResp
        : visionResp?.message?.content || visionResp?.content || '';
    } catch (_) { /* proceed without description */ }

    if (isCancelled) return;

    // Step 2: txt2img with style prompt
    setStatus('正在生成 ' + style.name + ' 风格插画...', 'info');
    const puterPrompt = style.puterPrompt || style.prompt.substring(0, 300);
    const fullPrompt = description
      ? `${puterPrompt}. Scene content: ${description}`
      : puterPrompt;

    const imgResult = await puter.ai.txt2img(fullPrompt, false);
    if (isCancelled) return;

    let resultUrl;
    if (imgResult instanceof HTMLImageElement) {
      resultUrl = imgResult.src;
    } else if (typeof imgResult === 'string') {
      resultUrl = imgResult;
    } else if (imgResult?.src) {
      resultUrl = imgResult.src;
    } else if (imgResult?.url) {
      resultUrl = imgResult.url;
    } else {
      throw new Error('未获得图片结果，请重试');
    }

    currentResultB64 = resultUrl;
    document.getElementById('resultImg').src = resultUrl;
    document.getElementById('resultLabel').textContent = style.name + ' · Puter';
    document.getElementById('results').classList.add('show');
    setStatus('生成完成！', 'success');
    await saveHistory(originalDataUrl, currentPhotoKey, resultUrl, style.name + ' (Puter)', 0);
    resetGeneratingState();
  } catch (e) {
    if (!isCancelled) { setStatus('错误: ' + e.message, 'error'); resetGeneratingState(); }
  }
}

// ── Copy / Download ──
async function dataUrlToBlob(dataUrl) { return (await fetch(dataUrl)).blob(); }

function blobToPng(blob) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objUrl = URL.createObjectURL(blob);
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(objUrl);
      c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(objUrl); reject(new Error('load failed')); };
    img.src = objUrl;
  });
}

async function copyResult() {
  if (!currentResultB64) return;
  const btn = document.getElementById('copyBtn');
  try {
    const blob = await dataUrlToBlob(currentResultB64);
    const fname = 'illustration-' + activeStyleId + '-' + Date.now() + '.jpg';
    if (navigator.share && /iPad|iPhone|iPod/.test(navigator.userAgent)) {
      const file = new File([blob], fname, { type: blob.type });
      await navigator.share({ files: [file] });
      showBtnFeedback(btn, '✓ 已分享', false);
    } else {
      const pngBlob = await blobToPng(blob);
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
      showBtnFeedback(btn, '✓ 已复制', false);
    }
  } catch (e) { if (e.name !== 'AbortError') showBtnFeedback(btn, '复制失败', true); }
}

async function downloadResult() {
  if (!currentResultB64) return;
  const btn = document.getElementById('downloadBtn');
  try {
    const blob = await dataUrlToBlob(currentResultB64);
    const fname = 'illustration-' + activeStyleId + '-' + Date.now() + '.jpg';
    const testFile = new File([], 't', { type: 'image/jpeg' });
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [testFile] })) {
      const file = new File([blob], fname, { type: blob.type });
      await navigator.share({ files: [file] });
      showBtnFeedback(btn, '✓ 已保存', false);
    } else {
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl; a.download = fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(objUrl), 5000);
      showBtnFeedback(btn, '✓ 下载中', false);
    }
  } catch (e) { if (e.name !== 'AbortError') showBtnFeedback(btn, '下载失败', true); }
}

function showBtnFeedback(btn, msg, isError) {
  const original = btn.innerHTML;
  btn.textContent = msg;
  btn.classList.add(isError ? 'feedback-err' : 'feedback');
  setTimeout(() => { btn.innerHTML = original; btn.classList.remove('feedback', 'feedback-err'); }, 2000);
}

// ── History ──
function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch(e) { return []; } }

async function saveHistory(origSrc, photoKey, dataUrl, styleName, strengthPct) {
  const [origThumb, resultThumb] = await Promise.all([
    makeThumbnail(origSrc, 300),
    makeThumbnail(dataUrl, 400),
  ]);

  let history = getHistory();
  const idx = history.findIndex(p => p.key === photoKey);
  const label = styleName + (strengthPct ? ' · ' + strengthPct + '%' : '');
  const newResult = { img: resultThumb, time: Date.now(), style: styleName, strength: strengthPct, label };
  if (idx !== -1) {
    history[idx].results.unshift(newResult);
    history[idx].results = history[idx].results.slice(0, 3);
    const [entry] = history.splice(idx, 1);
    history.unshift(entry);
  } else {
    history.unshift({ key: photoKey, orig: origThumb, firstUploaded: Date.now(), results: [newResult] });
    history = history.slice(0, 3);
  }
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) {
    history = history.slice(0, 1);
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (_) {}
  }
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('historyContainer');
  const history = getHistory();
  if (!history.length) { container.innerHTML = '<div class="history-empty">暂无记录</div>'; return; }
  container.innerHTML = history.map((photo, pi) => {
    const date = new Date(photo.firstUploaded).toLocaleDateString('zh', { month: 'short', day: 'numeric' });
    const resultsHtml = photo.results.map((r, ri) => `
      <div class="history-result-thumb" onclick="viewResult(${pi},${ri})">
        <img src="${r.img}" alt="${r.label || r.style}">
        <div class="history-result-thumb-label">${r.label || r.style || '—'}</div>
      </div>`).join('');
    const emptySlots = Array(3 - photo.results.length).fill(0).map(() =>
      `<div class="history-result-thumb" style="background:rgba(245,237,224,0.4);cursor:default;min-height:100px;display:flex;align-items:center;justify-content:center;">
        <span style="font-family:'Playfair Display',serif;font-size:0.65rem;color:#c9b99a">—</span>
      </div>`).join('');
    return `
      <div class="history-photo-card">
        <div class="history-photo-card-header">
          <span>照片 ${pi+1} · ${photo.results.length} 次生成</span>
          <small>${date}</small>
        </div>
        <div class="history-photo-body">
          <div class="history-orig" onclick="restorePhoto(${pi})">
            <img src="${photo.orig}" alt="原图">
            <div class="history-orig-badge">Original</div>
          </div>
          <div class="history-results">${resultsHtml}${emptySlots}</div>
        </div>
      </div>`;
  }).join('');
}

function viewResult(photoIdx, resultIdx) {
  const photo = getHistory()[photoIdx];
  if (!photo) return;
  const result = photo.results[resultIdx];
  if (!result) return;
  document.getElementById('originalImg').src = photo.orig;
  document.getElementById('resultImg').src = result.img;
  document.getElementById('resultLabel').textContent = (result.style || 'Style') + ' Style';
  currentResultB64 = result.img;
  document.getElementById('results').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restorePhoto(photoIdx) {
  const photo = getHistory()[photoIdx];
  if (!photo) return;
  originalDataUrl = photo.orig; currentPhotoKey = photo.key;
  document.getElementById('previewImg').src = photo.orig;
  document.getElementById('originalImg').src = photo.orig;
  document.getElementById('uploadPlaceholder').style.display = 'none';
  document.getElementById('uploadPreview').style.display = 'block';
  dropZone.classList.add('has-image'); dropZone.style.borderColor = 'var(--ochre)';
  const img = new Image();
  img.onload = () => { origW = img.naturalWidth; origH = img.naturalHeight; };
  img.src = photo.orig;
  document.getElementById('generateBtn').disabled = false;
  if (photo.results.length) {
    currentResultB64 = photo.results[0].img;
    document.getElementById('resultImg').src = currentResultB64;
    document.getElementById('resultLabel').textContent = (photo.results[0].style || 'Style') + ' Style';
    document.getElementById('results').classList.add('show');
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Initialise ──
applySiteName(localStorage.getItem(TITLE_KEY) || '');
selectService(activeService);
renderHistory();
